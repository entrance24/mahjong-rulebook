<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>特殊麻雀ルールブック</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        YuGothic,
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      line-height: 1.7;
    }

    .container {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
      padding: 50px 0 70px;
    }

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    header h1 {
      margin: 0;
      color: #8b0000;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: 0.08em;
    }

    header p {
      margin: 10px 0 0;
      color: #777;
      font-size: 0.95rem;
    }

    .section-title {
      margin: 0 0 18px;
      padding: 10px 15px;
      border-left: 6px solid #b71c1c;
      background: #fff0f0;
      color: #8b0000;
      font-size: 1.3rem;
    }

    .rule-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .rule-card {
      display: flex;
      flex-direction: column;
      min-height: 190px;
      padding: 24px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .rule-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.10);
    }

    .rule-number {
      display: inline-block;
      margin-bottom: 8px;
      color: #b71c1c;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .rule-card h3 {
      margin: 0 0 10px;
      color: #333;
      font-size: 1.25rem;
    }

    .rule-card p {
      margin: 0 0 20px;
      color: #666;
      font-size: 0.92rem;
    }

    .rule-link {
      display: inline-block;
      margin-top: auto;
      padding: 10px 16px;
      border-radius: 6px;
      background: #b71c1c;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    .rule-link:hover {
      background: #8b0000;
    }

    footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      color: #888;
      text-align: center;
      font-size: 0.8rem;
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 24px, 900px);
        padding-top: 35px;
      }

      .rule-list {
        grid-template-columns: 1fr;
      }

      .rule-card {
        min-height: auto;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>特殊麻雀ルールブック</h1>
      <p>仲間内で遊ぶ特殊麻雀のルールをまとめています。</p>
    </header>

    <main>

      <h2 class="section-title">ルールブック一覧</h2>

      <div class="rule-list">

        <!-- 清一色ゲーム -->
        <section class="rule-card">
          <div>
            <span class="rule-number">RULE 01</span>
            <h3>清一色ゲーム（三人麻雀）</h3>
            <p>
              三人麻雀をベースにした清一色系の特殊ルールです。
            </p>
          </div>

          <a
            class="rule-link"
            href="rulebooks/chinitsuGame03/"
          >
            ルールを見る →
          </a>
        </section>


        <!-- パチンコ -->
        <section class="rule-card">
          <div>
            <span class="rule-number">RULE 02</span>
            <h3>パチンコ</h3>
            <p>
              少牌マイティーを採用し、
              ビンゴ・チューリップ・確変・16Rを組み合わせた特殊ルールです。
            </p>
          </div>

          <a
            class="rule-link"
            href="rulebooks/pachinko/"
          >
            ルールを見る →
          </a>
        </section>

      </div>

    </main>

    <footer>
      特殊麻雀ルールブック
    </footer>

  </div>

</body>
</html>
